function draw(){tray.innerHTML='';targets.innerHTML='';spots.forEach(([name,x,y],i)=>{let t=document.createElement('div');t.className='target'+(assignments[i]!==undefined?' good':'');t.style.left=x+'%';t.style.top=y+'%';t.dataset.index=i;t.tabIndex=0;t.setAttribute('aria-label','Zuordnungsfeld '+(i+1));if(assignments[i]!==undefined){let s=document.createElement('span');s.className='placed';s.textContent=spots[assignments[i]][0];s.style.background=colors[assignments[i]];t.append(s)}t.onclick=()=>{if(selected!==null){for(let k in assignments)if(assignments[k]===selected)delete assignments[k];assignments[i]=selected;selected=null;status.textContent='';draw()}else if(assignments[i]!==undefined){selected=assignments[i];delete assignments[i];draw()}};t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click()}};targets.append(t)});spots.forEach(([name],i)=>{if(Object.values(assignments).includes(i))return;let c=document.createElement('div');c.className='chip'+(selected===i?' selected':'');c.style.background=colors[i];c.textContent=name;c.tabIndex=0;c.setAttribute('role','button');c.onclick=()=>{selected=i;draw()};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click()}};c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const startX=e.clientX,startY=e.clientY;let ghost=null;const move=ev=>{if(!ghost&&Math.hypot(ev.clientX-startX,ev.clientY-startY)>6){ghost=c.cloneNode(true);ghost.classList.add('dragging');ghost.style.width=c.offsetWidth+'px';document.body.append(ghost)}if(ghost){ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+'px'}};const up=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);if(!ghost)return;ghost.remove();let found=null,dist=Infinity;document.querySelectorAll('.target').forEach(t=>{const r=t.getBoundingClientRect(),dx=ev.clientX-(r.left+r.width/2),dy=ev.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy);if(d<Math.max(42,r.width/2+20)&&d<dist){found=+t.dataset.index;dist=d}});if(found!==null){for(let k in assignments)if(assignments[k]===i)delete assignments[k];assignments[found]=i;selected=null;status.textContent='';draw()}};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true})});tray.append(c)})}
