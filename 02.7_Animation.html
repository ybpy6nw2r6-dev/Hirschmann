<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ähnliche Dreiecke</title><style>body{margin:0;background:#f4f6fa;font-family:'Calibri Light',Calibri,'Segoe UI',sans-serif;color:#243247}.wrap{max-width:980px;margin:20px auto;background:white;border:1px solid #d9dfe8;border-radius:18px;padding:24px;box-shadow:0 8px 25px #1422380d}h1{font-size:30px;font-weight:400;margin:0 0 7px}.sub{color:#65758b;margin-bottom:15px}.scene{border:1px solid #dce3ed;border-radius:14px;overflow:hidden;background:#fcfdff}svg{display:block;width:100%;height:auto}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{background:#315fbc;color:white;border:0;border-radius:9px;padding:12px 19px;font:inherit;font-size:17px;cursor:pointer}button.secondary{background:#e8edf5;color:#30415d}button:disabled{opacity:.45;cursor:default}.status{border-left:4px solid #6084c6;background:#f1f5fb;padding:13px 17px;border-radius:6px;min-height:50px;font-size:18px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.step{border:1px solid #d4dce7;padding:7px 11px;border-radius:18px;color:#6a778b;font-size:14px}.step.active{background:#e3edff;color:#2351a4;border-color:#87a7e8}.step.done{background:#e7f5ec;color:#227447;border-color:#a2d4b3}.result{font-size:19px;color:#216c43;font-weight:600;margin-top:10px;min-height:26px}@media(max-width:600px){.wrap{margin:0;padding:13px;border-radius:0}h1{font-size:25px}.status{font-size:16px}}</style></head><body><main class="wrap"><h1>Ähnliche Dreiecke</h1><div class="scene"><svg id="drawing" viewBox="0 0 900 500" role="img" aria-label="Zwei ähnliche Dreiecke; das blaue wird gestreckt, gedreht und verschoben, bis es das orange Dreieck überdeckt"><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e9edf4" stroke-width="1"/></pattern></defs><rect width="900" height="500" fill="url(#grid)"/><text x="35" y="40" font-size="19" fill="#65758b">Dreieck 1</text><text x="600" y="40" font-size="19" fill="#65758b">Dreieck 2</text><polygon id="target" fill="#f2a348" fill-opacity=".25" stroke="#e18a20" stroke-width="4" stroke-linejoin="round"/><polygon id="moving" fill="#377bdf" fill-opacity=".32" stroke="#2763b9" stroke-width="4" stroke-linejoin="round"/><g id="labels" font-size="19" font-weight="600"></g><circle id="center" cx="0" cy="0" r="5" fill="#2763b9"/><text id="centerlabel" font-size="17" fill="#2763b9">Z</text><text id="caption" x="450" y="475" font-size="19" fill="#53677f" text-anchor="middle">Zwei ähnliche Dreiecke</text></svg></div><div class="steps"><span class="step" id="s0">Ausgangslage</span><span class="step" id="s1">1. Zentrische Streckung</span><span class="step" id="s2">2. Drehung</span><span class="step" id="s3">3. Verschiebung</span><span class="step" id="s4">Deckungsgleich</span></div><div class="buttons"><button id="play">▶ Animation starten</button><button class="secondary" id="next">Nächster Schritt</button><button class="secondary" id="reset">↻ Zurücksetzen</button></div><div class="status" id="status" aria-live="polite"></div><div class="result" id="result" aria-live="polite"></div></main><script>
(()=>{'use strict';const svg=document.getElementById('drawing'),mov=document.getElementById('moving'),tar=document.getElementById('target'),labels=document.getElementById('labels'),caption=document.getElementById('caption'),status=document.getElementById('status'),result=document.getElementById('result'),center=document.getElementById('center'),centerlabel=document.getElementById('centerlabel'),play=document.getElementById('play'),next=document.getElementById('next');const P=[[-95,75],[85,75],[-35,-105]],C=[245,260],T=[650,245],k=1.55,a=32*Math.PI/180;let phase=0,anim=false,raf=0;const rotate=(p,angle)=>[p[0]*Math.cos(angle)-p[1]*Math.sin(angle),p[0]*Math.sin(angle)+p[1]*Math.cos(angle)];function vertices(scale,ang,pos){return P.map(p=>{const r=rotate(p,ang);return [pos[0]+r[0]*scale,pos[1]+r[1]*scale]})}const fmt=v=>v.map(p=>p.map(x=>x.toFixed(2)).join(',')).join(' ');tar.setAttribute('points',fmt(vertices(k,a,T)));function text(x,y,str,color){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('fill',color);t.textContent=str;labels.appendChild(t)}function draw(scale,angle,pos,step){mov.setAttribute('points',fmt(vertices(scale,angle,pos)));labels.replaceChildren();vertices(scale,angle,pos).forEach((p,i)=>text(p[0]+(i===0?-23:12),p[1]+(i===2?-12:24),['A','B','C'][i],'#2763b9'));vertices(k,a,T).forEach((p,i)=>text(p[0]+(i===0?-22:12),p[1]+(i===2?-12:24),["A′","B′","C′"][i],'#b36a0e'));center.setAttribute('cx',pos[0]);center.setAttribute('cy',pos[1]);centerlabel.setAttribute('x',pos[0]+10);centerlabel.setAttribute('y',pos[1]-10);center.style.opacity=step<=1?1:0;centerlabel.style.opacity=step<=1?1:0;caption.textContent=['Zwei ähnliche Dreiecke','Streckfaktor k = 1,55','Drehwinkel 32°','Verschiebung zum orangefarbenen Dreieck','Beide Dreiecke liegen genau übereinander'][step];for(let i=0;i<5;i++){const s=document.getElementById('s'+i);s.className='step'+(i===step?' active':i<step?' done':'')}const messages=['','Das blaue Dreieck wird vom Zentrum Z aus mit dem Faktor k = 1,55 gestreckt.','Das vergrößerte Dreieck wird um 32° gedreht.','Das Dreieck wird verschoben, bis es auf dem orangefarbenen Dreieck liegt.','Geschafft! Beide Dreiecke sind jetzt deckungsgleich.'];status.textContent=messages[step];result.textContent=step===4?'Merke: Ähnliche Dreiecke können durch zentrische Streckung und Bewegungen zur Deckung gebracht werden.':'';next.disabled=step===4;play.disabled=anim}function frameAt(p){if(p<=1)return [1+(k-1)*p,0,C, p<1?0:1];if(p<=2)return [k,a*(p-1),C,2];if(p<=3)return [k,a,[C[0]+(T[0]-C[0])*(p-2),C[1]+(T[1]-C[1])*(p-2)],3];return [k,a,T,4]}function setPhase(p){phase=p;const [sc,an,pos,step]=frameAt(p);draw(sc,an,pos,p===0?0:p===1?1:p===2?2:p===3?4:step)}function animateTo(end,done){if(anim)return;anim=true;play.disabled=true;next.disabled=true;let start=performance.now(),begin=phase,duration=(end-begin)*3500;function tick(now){let t=Math.min(1,(now-start)/duration),e=t*t*(3-2*t),p=begin+(end-begin)*e;const [sc,an,pos]=frameAt(p);draw(sc,an,pos,Math.min(3,Math.ceil(p)));if(t<1){raf=requestAnimationFrame(tick)}else{anim=false;setPhase(end);play.disabled=false;if(done)done()}}raf=requestAnimationFrame(tick)}play.onclick=()=>{if(anim)return;if(phase>=3)setPhase(0);animateTo(3)};next.onclick=()=>{if(phase<3)animateTo(Math.floor(phase)+1)};document.getElementById('reset').onclick=()=>{cancelAnimationFrame(raf);anim=false;setPhase(0);play.disabled=false};setPhase(0)})();
</script></body></html>
