<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathe-Escape-Room – Zahlenschloss</title><style>body{font-family:'Calibri Light',Calibri,Arial,sans-serif;background:#f6f7f9;color:#27313d;display:grid;place-items:center;min-height:100vh;margin:0}.panel{text-align:center;background:white;border:2px solid #9aa1a9;border-radius:22px;padding:28px;width:min(90vw,430px);box-shadow:0 12px 35px #0001}h1{font-weight:400}.lock{height:210px;position:relative;margin:12px auto 20px;width:190px}.shackle{position:absolute;width:105px;height:115px;border:19px solid #a9adb3;border-bottom:0;border-radius:70px 70px 0 0;left:23px;top:0;transition:transform .7s ease,top .7s ease}.body{position:absolute;bottom:0;left:12px;width:166px;height:115px;background:linear-gradient(135deg,#e65b60,#ad2333);border-radius:18px;display:grid;place-items:center;color:white;font-size:52px;box-shadow:0 6px 0 #7f1725}.opened .shackle{transform:translate(28px,-24px) rotate(25deg);transform-origin:25px 100px}.opened .body{background:linear-gradient(135deg,#e65b60,#ad2333)}.digits{display:flex;justify-content:center;gap:10px}input{width:48px;height:62px;text-align:center;font-size:32px;border:2px solid #aab2ba;border-radius:12px;font-family:inherit}input:focus{outline:3px solid #a9d5ff}button{font:inherit;font-size:19px;padding:12px 24px;margin:18px 5px 4px;border:0;border-radius:12px;background:#b92f3c;color:white;cursor:pointer}button.secondary{background:#e7ebef;color:#263645}#status{min-height:30px;font-size:20px;margin-top:12px}.success{color:#167b50}.error{color:#b33d42}.hint{color:#697682;font-size:14px}.confetti{position:fixed;top:-20px;width:9px;height:14px;animation:fall 2.5s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(650deg);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="panel"><h1>🔐 Knacke den Geheimcode!</h1><p>Gib die vier richtigen Ziffern ein.</p><div class="lock" id="lock"><div class="shackle"></div><div class="body" id="symbol">●</div></div><div class="digits" id="digits"><input aria-label="Ziffer 1" inputmode="numeric" maxlength="1" pattern="[0-9]*"><input aria-label="Ziffer 2" inputmode="numeric" maxlength="1" pattern="[0-9]*"><input aria-label="Ziffer 3" inputmode="numeric" maxlength="1" pattern="[0-9]*"><input aria-label="Ziffer 4" inputmode="numeric" maxlength="1" pattern="[0-9]*"></div><button id="check">Schloss öffnen</button><button class="secondary" id="reset">Zurücksetzen</button><div id="status" role="status" aria-live="polite"></div></main><script>const CODE='5359'; // Hier den vierstelligen Geheimcode ändern.
const inputs=[...document.querySelectorAll('input')],lock=document.getElementById('lock'),status=document.getElementById('status');inputs.forEach((el,i)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&i<3)inputs[i+1].focus()});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0)inputs[i-1].focus();if(e.key==='Enter')check()});el.addEventListener('paste',e=>{e.preventDefault();const s=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,4);[...s].forEach((v,j)=>inputs[j].value=v);inputs[Math.min(s.length,3)].focus()})});function check(){if(lock.classList.contains('opened'))return;const code=inputs.map(i=>i.value).join('');if(code.length!==4){status.textContent='Bitte gib vier Ziffern ein.';status.className='error';return}if(code===CODE){lock.classList.add('opened');document.getElementById('symbol').textContent='✓';status.textContent='🎉 Richtig! Das Schloss ist offen!';status.className='success';for(let i=0;i<60;i++){const p=document.createElement('span');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.background=['#e8b54a','#4aa3d4','#58b68a','#d66e9d'][i%4];p.style.animationDelay=Math.random()*.7+'s';document.body.append(p);setTimeout(()=>p.remove(),3500)}}else{status.textContent='Noch nicht richtig. Versuch es erneut!';status.className='error';inputs.forEach(i=>i.value='');inputs[0].focus()}}document.getElementById('check').addEventListener('click',check);document.getElementById('reset').addEventListener('click',()=>{lock.classList.remove('opened');document.getElementById('symbol').textContent='●';status.textContent='';inputs.forEach(i=>i.value='');inputs[0].focus()});</script></body></html>
